# Har kuni 1 ta uzun video, 1 ta ingliz tili darsi va 3 ta Shorts yaratib, YouTube kanalga yuklaydi.
# Qo'lda ishga tushirish: GitHub → Actions → "Daily kids video" → Run workflow
name: Daily kids video
run-name: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 14 * * *' && 'Kunlik uzun video (avto)' || github.event.schedule == '0 12 * * *' && 'Kunlik ingliz tili darsi (avto)' || 'Kunlik Shorts (avto)') || format('{0} · {1} · {2}', inputs.format == 'short' && 'Shorts' || format('{0} daq', inputs.length || '3'), inputs.type, (inputs.clips && 'Flow kliplaridan') || (inputs.topic && 'prompt bilan') || (inputs.reference && 'namuna asosida') || 'AI mavzu tanlaydi') }}

on:
  schedule:
    - cron: "0 14 * * *" # uzun video: 14:00 UTC (Toshkent 19:00, AQSh sharqi 10:00)
    - cron: "0 12 * * *" # uzun ingliz tili darsi: Toshkent 17:00
    - cron: "0 6 * * *" # Shorts: Toshkent 11:00
    - cron: "0 10 * * *" # Shorts: Toshkent 15:00
    - cron: "0 18 * * *" # Shorts: Toshkent 23:00 (AQSh kunduzi)
  workflow_dispatch:
    inputs:
      topic:
        description: "Mavzu (bo'sh qolsa AI o'zi tanlaydi)"
        default: ""
      reference:
        description: "Namuna YouTube havolasi (ixtiyoriy) — shu formatda original video"
        default: ""
      format:
        description: "Format"
        type: choice
        options: [long, short]
        default: long
      type:
        description: "Video turi"
        type: choice
        options: [auto, story, education, facts, cartoon, games, english]
        default: auto
      length:
        description: "Uzunligi, daqiqa (bo'sh: uzun = 3, Shorts = ~45 soniya)"
        default: ""
      privacy:
        description: "YouTube holati"
        type: choice
        options: [public, unlisted, private]
        default: public
      voice:
        description: "Ovoz"
        type: choice
        options: [en-US-JennyNeural, en-US-AnaNeural, en-US-AriaNeural, en-GB-SoniaNeural, en-US-GuyNeural, en-US-AndrewNeural]
        default: en-US-JennyNeural
      style:
        description: "Vizual uslub"
        type: choice
        options: [auto, stock, ai]
        default: auto
      clips:
        description: "Botga yuborilgan kliplar (Telegram file_id, vergul bilan) — ulardan epizod"
        default: ""
      review:
        description: "Avval Telegram'da ko'rsatish (yuklash faqat tasdiqlangandan keyin)"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write # topics_used.json ni saqlash uchun
  actions: write # navbatdagi (queued-*) artifact'larni o'qish va o'chirish

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Tizim paketlari (ffmpeg, Remotion uchun Chrome kutubxonalari)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core \
            libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0t64 \
            libpango-1.0-0 libcairo2 libcups2t64

      - name: Python va Remotion paketlari
        run: |
          pip install -q -r requirements.txt
          cd video && npm ci && npx remotion browser ensure

      - name: YouTube kalitlari
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > token.json

      - name: Fon musiqasi (yopiq repodan)
        env:
          MUSIC_TOKEN: ${{ secrets.MUSIC_TOKEN }}
        run: |
          if [ -z "$MUSIC_TOKEN" ]; then echo "MUSIC_TOKEN yo'q — musiqasiz"; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:${MUSIC_TOKEN}@github.com/${{ github.repository_owner }}/only-baby-music.git" assets/music \
            && echo "Treklar: $(ls assets/music/*.mp3 | wc -l)" || echo "Musiqa olinmadi — musiqasiz davom etamiz"

      - name: Navbatdagi videolar (YouTube limiti tufayli kutayotganlar)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_PRIVACY: ${{ inputs.privacy || vars.YOUTUBE_PRIVACY || 'public' }}
        run: python -W ignore main.py --upload-pending --privacy "$VIDEO_PRIVACY"

      - name: Video yaratish va yuklash
        id: video
        env:
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TYPE: ${{ inputs.type || vars.VIDEO_TYPE || 'auto' }}
          VIDEO_FORMAT: ${{ inputs.format || ((github.event.schedule == '0 14 * * *' || github.event.schedule == '0 12 * * *') && 'long') || 'short' }}
          VIDEO_LENGTH: ${{ inputs.length || vars.VIDEO_LENGTH || '' }}
          VIDEO_PRIVACY: ${{ inputs.privacy || vars.YOUTUBE_PRIVACY || 'public' }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          VIDEO_REVIEW: ${{ inputs.review }}
          VIDEO_CLIPS: ${{ inputs.clips }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_REFERENCE: ${{ inputs.reference }}
          VIDEO_VOICE: ${{ inputs.voice || vars.VIDEO_VOICE || 'en-US-JennyNeural' }}
          VIDEO_STYLE: ${{ inputs.style || vars.VIDEO_STYLE || 'auto' }}
        run: |
          args=(--format "$VIDEO_FORMAT" --type "$VIDEO_TYPE" --privacy "$VIDEO_PRIVACY" --voice "$VIDEO_VOICE" --style "$VIDEO_STYLE")
          if [ -n "$VIDEO_LENGTH" ] && [ "$VIDEO_FORMAT" = "long" ]; then args+=(--length "$VIDEO_LENGTH"); fi
          if [ -n "$VIDEO_TOPIC" ]; then args+=(--topic "$VIDEO_TOPIC"); fi
          if [ -n "$VIDEO_REFERENCE" ]; then args+=(--reference "$VIDEO_REFERENCE"); fi
          if [ "$VIDEO_REVIEW" = "true" ]; then args+=(--review); fi
          if [ -n "$VIDEO_CLIPS" ]; then args+=(--clips "$VIDEO_CLIPS"); fi
          # 19:00 dagi uzun video — davomli serialning bugungi epizodi
          if [ "$SCHEDULE_CRON" = "0 14 * * *" ]; then args+=(--serial); fi
          python -W ignore main.py "${args[@]}"

      - name: Telegram xabarnomasi
        if: ${{ !cancelled() }} # qo'lda to'xtatilgan ish uchun "xato" xabari yuborilmaydi
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.video.outcome }}
          ERROR_REASON: ${{ steps.video.outputs.error }}
          TITLE: ${{ steps.video.outputs.title }}
          VIDEO_URL: ${{ steps.video.outputs.video_url }}
          IG_URL: ${{ steps.video.outputs.ig_url }}
          THUMB: ${{ steps.video.outputs.thumbnail }}
          COST: ${{ steps.video.outputs.cost }}
          QUEUED: ${{ steps.video.outputs.queued }}
          REVIEW: ${{ steps.video.outputs.review }}
          PREVIEW: ${{ steps.video.outputs.preview }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram sozlanmagan"; exit 0; fi
          api="https://api.telegram.org/bot$TG_TOKEN"
          if [ "$OUTCOME" = "success" ] && [ "$REVIEW" = "1" ]; then
            # Buyurtma: video + "Joyla / O'chir" tugmalari (bot callback'lari publish.yml ni ishga tushiradi)
            caption=$(printf '👀 Video tayyor — ko'"'"'rib chiqing:\n\n%s' "$TITLE")
            if [ -n "$COST" ] && [ "$COST" != "0.00" ]; then caption=$(printf '%s\n\n💰 ~$%s' "$caption" "$COST"); fi
            markup=$(printf '{"inline_keyboard":[[{"text":"✅ YouTube'"'"'ga joyla","callback_data":"pub:%s"},{"text":"🗑 O'"'"'chir","callback_data":"del:%s"}]]}' "$RUN_ID" "$RUN_ID")
            curl -s -o /dev/null -F chat_id="$TG_CHAT" -F video=@"$PREVIEW" -F supports_streaming=true \
              -F caption="$caption" -F reply_markup="$markup" "$api/sendVideo"
          elif [ "$OUTCOME" = "success" ] && [ "$QUEUED" = "1" ]; then
            text=$(printf '⏳ Video tayyor, lekin YouTube bugungi yuklash limiti tugadi.\n\n%s\n\nKeyingi ishga tushishda avtomatik yuklanadi.' "$TITLE")
            curl -s -o /dev/null -d chat_id="$TG_CHAT" --data-urlencode text="$text" "$api/sendMessage"
          elif [ "$OUTCOME" = "success" ] && [ -n "$VIDEO_URL" ]; then
            caption=$(printf '✅ Yangi video yuklandi!\n\n%s\n%s' "$TITLE" "$VIDEO_URL")
            if [ -n "$IG_URL" ]; then caption=$(printf '%s\n📸 Instagram: %s' "$caption" "$IG_URL"); fi
            if [ -n "$COST" ] && [ "$COST" != "0.00" ]; then caption=$(printf '%s\n\n💰 Rasm va ovoz: ~$%s' "$caption" "$COST"); fi
            if [ -f "$THUMB" ]; then
              curl -s -o /dev/null -F chat_id="$TG_CHAT" -F photo=@"$THUMB" -F caption="$caption" "$api/sendPhoto"
            else
              curl -s -o /dev/null -d chat_id="$TG_CHAT" --data-urlencode text="$caption" "$api/sendMessage"
            fi
          else
            if [ -n "$ERROR_REASON" ]; then
              text=$(printf '❌ Video yasalmadi.\n\nSabab: %s\n\nLog: %s' "$ERROR_REASON" "$RUN_URL")
            else
              text=$(printf '❌ Video yasashda xato bo'"'"'ldi.\n\nLog: %s' "$RUN_URL")
            fi
            curl -s -o /dev/null -d chat_id="$TG_CHAT" --data-urlencode text="$text" "$api/sendMessage"
          fi

      - name: Videoni yuklab olish uchun saqlash (7 kun)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.video.outputs.review == '1' && 'review' || (steps.video.outputs.queued == '1' && 'queued' || 'video') }}-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/thumbnail.jpg
            output/*/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Ishlatilgan mavzularni saqlash
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Video yasalayotganda repoga boshqa commit tushgan bo'lishi mumkin — eng so'nggisiga birlashtiramiz
          git fetch -q origin main
          git show origin/main:topics_used.json > /tmp/remote_topics.json
          python - <<'EOF'
          import json
          remote = json.load(open("/tmp/remote_topics.json"))
          local = json.load(open("topics_used.json"))
          merged = remote + [t for t in local if t not in remote]
          json.dump(merged, open("topics_used.json", "w"), indent=2, ensure_ascii=False)
          EOF
          git reset -q origin/main  # faqat indeksni yangilaymiz — boshqa fayllar eski versiyaga qaytmasin
          git add topics_used.json
          [ -d episodes ] && git add episodes
          git diff --cached --quiet || (git commit -m "Mavzular ro'yxati yangilandi [skip ci]" && git push origin HEAD:main)
