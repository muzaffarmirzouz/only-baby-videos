<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Only Baby Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram mavzusidagi ranglar; brauzerda ochilsa — zaxira ranglar */
  :root {
    --bg: var(--tg-theme-bg-color, #fff8ef);
    --surface: var(--tg-theme-secondary-bg-color, #fff3e3);
    --text: var(--tg-theme-text-color, #2b2340);
    --muted: var(--tg-theme-hint-color, #7a6f8c);
    --link: var(--tg-theme-link-color, #3aa8ff);
    --accent: #ff5f8f;
    --green: #2fbf71;
    --red: #e5484d;
    --amber: #ffb020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px 16px 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 10px; }
  .card { background: var(--surface); border-radius: 16px; padding: 14px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  textarea, select {
    width: 100%; font: inherit; color: var(--text);
    background: var(--bg); border: 0; border-radius: 12px; padding: 10px 12px;
  }
  textarea { resize: none; min-height: 60px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font: inherit; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 999px; padding: 8px 14px;
    background: var(--bg); color: var(--text);
  }
  .chips button.on { background: var(--accent); color: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .create {
    width: 100%; margin-top: 16px;
    font: inherit; font-size: 16px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), #ff7a59);
    border: 0; border-radius: 14px; padding: 14px;
  }
  .create:disabled { opacity: .6; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; text-align: center; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }
  .run {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
  }
  .run:last-child { border-bottom: 0; }
  .run .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .run a { color: var(--link); font-size: 13px; font-weight: 600; text-decoration: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.p { background: var(--amber); animation: pulse 1.2s infinite; }
  .dot.ok { background: var(--green); }
  .dot.fail { background: var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .channel { display: block; text-align: center; margin-top: 18px; color: var(--link); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <h1>🎬 Only Baby Studio</h1>
  <div class="sub">Video GitHub serverida yasaladi, tayyor bo'lganda bot xabar beradi.</div>

  <div class="card">
    <div class="field">
      <label for="topic">Mavzu</label>
      <textarea id="topic" maxlength="200" placeholder="Why do cats purr? — bo'sh qolsa AI tanlaydi"></textarea>
    </div>
    <div class="field">
      <label for="reference">Namuna video (ixtiyoriy)</label>
      <textarea id="reference" style="min-height:44px" placeholder="YouTube havola — shu formatda original video"></textarea>
    </div>
    <div class="field">
      <label>Turi</label>
      <div class="chips" data-name="type">
        <button data-v="auto" class="on">🎲 Avto</button>
        <button data-v="story">📖 Ertak</button>
        <button data-v="education">🔤 Ta'limiy</button>
        <button data-v="facts">🦋 Faktlar</button>
        <button data-v="cartoon">🎨 Multik</button>
        <button data-v="games">🎮 O'yin</button>
      </div>
    </div>
    <div class="field">
      <label>Uzunlik</label>
      <div class="chips" data-name="length">
        <button data-v="3" class="on">3 daq</button>
        <button data-v="5">5</button>
        <button data-v="10">10</button>
        <button data-v="15">15</button>
        <button data-v="20">20</button>
      </div>
    </div>
    <div class="field">
      <label>Vizual uslub</label>
      <div class="chips" data-name="style">
        <button data-v="auto" class="on">Avto</button>
        <button data-v="stock">Stok video</button>
        <button data-v="ai">AI rasm</button>
      </div>
    </div>
    <div class="row field">
      <div>
        <label for="voice">Ovoz</label>
        <select id="voice">
          <option value="en-US-JennyNeural">Jenny · ayol</option>
          <option value="en-US-AnaNeural">Ana · bola</option>
          <option value="en-US-AriaNeural">Aria · ayol</option>
          <option value="en-GB-SoniaNeural">Sonia · UK</option>
          <option value="en-US-GuyNeural">Guy · erkak</option>
          <option value="en-US-AndrewNeural">Andrew · erkak</option>
        </select>
      </div>
      <div>
        <label for="privacy">Ko'rinish</label>
        <select id="privacy">
          <option value="public">Public</option>
          <option value="unlisted">Unlisted</option>
          <option value="private">Private</option>
        </select>
      </div>
    </div>
    <div class="hint" id="estimate"></div>
  </div>

  <button class="create" id="create">Video yasash</button>
  <div class="msg" id="msg"></div>

  <h2>Buyurtmalar</h2>
  <div class="card" id="runs"><div class="empty">Yuklanmoqda…</div></div>

  <a class="channel" href="https://www.youtube.com/channel/UCVeXPyPFS5Hfb5Ci96ZjDnw" id="channel">YouTube kanalni ochish ↗</a>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (s) => document.querySelector(s);
const state = { type: "auto", length: "3", style: "auto" };

document.querySelectorAll(".chips").forEach((group) => {
  group.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    group.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    state[group.dataset.name] = b.dataset.v;
    tg?.HapticFeedback?.selectionChanged();
    estimate();
  });
});

function estimate() {
  const len = +state.length;
  const scenes = Math.ceil((len * 130) / 45);
  const ai = state.style === "ai" || (state.style === "auto" && ["story", "cartoon"].includes(state.type));
  const mins = Math.round(4 + scenes * (ai ? 0.85 : 0.15) + len * 0.8);
  $("#estimate").textContent = `Taxminan ${mins} daqiqada tayyor bo'ladi (${scenes} sahna).`;
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg?.initData || "" },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

$("#create").addEventListener("click", async () => {
  const btn = $("#create"), msg = $("#msg");
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "Yuborilmoqda…";
  try {
    await api("/api/create", {
      method: "POST",
      body: JSON.stringify({ ...state, topic: $("#topic").value, reference: $("#reference").value.trim(), voice: $("#voice").value, privacy: $("#privacy").value }),
    });
    tg?.HapticFeedback?.notificationOccurred("success");
    msg.className = "msg ok";
    msg.textContent = "✅ Qabul qilindi! Tayyor bo'lganda bot xabar beradi.";
    $("#topic").value = "";
    $("#reference").value = "";
    setTimeout(loadRuns, 4000);
  } catch (e) {
    tg?.HapticFeedback?.notificationOccurred("error");
    msg.className = "msg err";
    msg.textContent = "Xato: " + e.message;
  } finally {
    btn.disabled = false;
  }
});

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "hozirgina";
  if (m < 60) return `${m} daq oldin`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} soat oldin` : `${Math.round(h / 24)} kun oldin`;
}

function runState(r) {
  if (r.status !== "completed") return ["p", r.status === "queued" ? "Navbatda" : "Yasalmoqda…"];
  if (r.conclusion === "success") return ["ok", "Tayyor"];
  if (r.conclusion === "cancelled") return ["", "Bekor qilindi"];
  return ["fail", "Xato"];
}

let timer;
async function loadRuns() {
  clearTimeout(timer);
  let active = false;
  try {
    const runs = await api("/api/runs");
    $("#runs").innerHTML = runs.length ? runs.map((r) => {
      const [cls, label] = runState(r);
      if (cls === "p") active = true;
      return `<div class="run"><span class="dot ${cls}"></span>
        <div style="min-width:0"><div class="t">${esc(r.title)}</div>
        <div class="s">${label} · ${ago(r.created)}${r.event === "schedule" ? " · kunlik" : ""}</div></div>
        <a href="${r.url}" target="_blank">↗</a></div>`;
    }).join("") : `<div class="empty">Hali buyurtma yo'q.</div>`;
  } catch (e) {
    $("#runs").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
  timer = setTimeout(loadRuns, active ? 15000 : 60000);
}

$("#channel").addEventListener("click", (e) => {
  if (tg) { e.preventDefault(); tg.openLink(e.currentTarget.href); }
});

estimate();
loadRuns();
</script>
</body>
</html>
