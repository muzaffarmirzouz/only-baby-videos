# Ssenariy uchun OpenAI modeli
openai_model: gpt-4o-mini

# Ovoz (edge-tts). Boshqa variantlar: en-US-AnaNeural (bola ovozi), en-GB-SoniaNeural, en-US-GuyNeural
voice: en-US-JennyNeural
voice_rate: "-10%"

# Bolalar uchun sekinroq nutq: daqiqada taxminan so'zlar soni
words_per_minute: 130
words_per_scene: 45

video:
  width: 1920
  height: 1080
  music_volume: 0.16   # fon musiqasi ovozi (0..1); nutqdan ~15 dB past
  render_concurrency: 2  # Remotion bir vaqtda nechta kadr chizadi (ko'p = tez, lekin kompyuter qiziydi)
  clip_sound_volume: 0.6  # Flow kliplarining o'z ovoz effektlari (0 = o'chiq), ertakchi ovozi ostida
  captions: false        # ekrandagi subtitrlar (kichik bolalar o'qiy olmaydi, rasmni to'sadi)
  crf: 16                # video sifati: kichik = sifatliroq (16 ≈ 8 Mbit/s, YouTube 1080p tavsiyasi)

image_style: >-
  cute colorful children's book illustration, soft lighting, friendly characters,
  bright pastel colors, safe for kids, high detail, no text

youtube:
  privacy: private        # private | unlisted | public
  made_for_kids: true     # COPPA: bolalar kontenti uchun majburiy
  category_id: "27"       # 27 = Education, 1 = Film & Animation

cartoon_style: >-
  2D cartoon animation still, kids TV show style, bold clean outlines, flat vibrant colors,
  expressive cute characters, simple background, no text

# Har video turi uchun media manbalari (tartib bo'yicha sinaladi):
#   pixabay_video, pixabay_photo, pixabay_illustration, pixabay_all — Pixabay (PIXABAY_API_KEY)
#   ai — Pollinations AI rasm (tekin rejimda 45 soniyada 1 ta)
media:
  story: [ai, pixabay_illustration]
  education: [pixabay_illustration, pixabay_photo, ai]
  facts: [pixabay_video, pixabay_photo, ai]
  cartoon: [ai, pixabay_illustration]
  games: [pixabay_photo, pixabay_illustration, ai]

# Pullik rejim (OpenAI). enabled: false — hammasi tekin xizmatlarda ishlaydi.
# OpenAI'da oylik xarajat chegarasini qo'yishni unutmang: platform.openai.com → Settings → Limits
premium:
  enabled: true
  image_model: gpt-image-2      # arzonroq: gpt-image-1-mini
  image_quality: medium        # low | medium | high
  sprite_model: gpt-image-1.5   # multik qahramonlari (shaffof fon)
  tts_model: gpt-4o-mini-tts
  tts_instructions: >-
    You are a warm, gentle and playful storyteller for young children.
    Speak clearly and a little slowly, with lots of expression, smiles and wonder in your voice.
    Make character lines lively, and slow down for the gentle moral at the end.

# Haqiqiy AI animatsiya (Google Gemini Omni, GEMINI_API_KEY). Multikning 2 ta sahnasi jonlanadi.
animate:
  enabled: true
  model: gemini-omni-1.1-flash
  resolution: 360p        # 360p ≈ $0.034/s, 720p ≈ $0.10/s
  seconds: 5
  scenes_per_video: 2
